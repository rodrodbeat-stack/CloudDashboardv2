name: SKYNET CI/CD - CloudDashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: DEV - Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate static website
        run: |
          test -f index.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          echo "DEV validation passed"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  cert:
    name: CERT - Certification checks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check required files and workflow structure
        run: |
          echo "CERT environment: basic certification checks passed"
          echo "Extend this stage with HTML validation, accessibility and security scans."

  qa:
    name: QA - Quality checks
    needs: cert
    runs-on: ubuntu-latest
    steps:
      - name: QA smoke checks
        run: |
          echo "QA environment: smoke checks passed"
          echo "Add real functional/E2E tests here as the application grows."

  prod:
    name: PROD - Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
