name: SKYNET CI/CD - CloudDashboardv2
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skynet-cloud-dashboardv2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dev:
    name: DEV - Checkout, build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate assets and JavaScript
        run: |
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          grep -qi '<html' index.html
          grep -q 'CloudDashboardv2' index.html
          node --check assets/js/app.js
          echo "DEV checks passed"
  test:
    name: DEV - Smoke tests
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pipeline structure
        run: |
          for stage in dev test security cert qa prod health; do grep -q "data-stage=\"$stage\"" index.html; done
          grep -q 'id="eventLog"' index.html
          echo "Smoke tests passed"
  security:
    name: DEVSECOPS - Basic secret-pattern gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check common secret patterns
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Potential secret pattern found"
            exit 1
          fi
          echo "Basic secret-pattern check passed"
  cert:
    name: CERT - Release certification
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Certify release structure
        run: |
          test -s index.html && test -s assets/css/style.css && test -s assets/js/app.js
          echo "CERT checks passed"
  qa:
    name: QA - Quality assurance
    needs: cert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: QA syntax and accessibility preference checks
        run: |
          node --check assets/js/app.js
          grep -q 'prefers-reduced-motion' assets/css/style.css
          grep -q 'GitHub Actions' index.html
          echo "QA checks passed"
  prod:
    name: PROD - Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deployment endpoint notice
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}"
